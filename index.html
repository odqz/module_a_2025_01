<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/animated-words.js" defer></script>
  <script src="js/carousel.js"></script>
  <srcipt src="js/map.js"></srcipt>
  <script src="js/search.js"></script>
  <link rel="stylesheet" href="fonts/fontawesome/fontawesome.min.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="header-title">
        <img src="img/logo.svg" alt="Spark Studios company logo">
        <h1>Spark Studios</h1>
      </div>
      <nav class="header-nav">
        <a href="#hero">Home</a>
        <a href="#about">About</a>
        <a href="#portfolio">Portfolio</a>
        <a href="#value-cta">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Hero container -->
  <section id="hero" class="hero-container container"></section>

  <!-- About section -->
  <section id="about" class="about-container container"></section>

  <!-- Portfolio section -->
  <section id="portfolio" class="portfolio-container container"></section>

  <!-- Value and call to action container -->
  <section id="value-cta" class="value-cta-container container"></section>

  <!-- Clients container -->
  <section id="clients" class="clients-container container"></section>

  <!-- Info and location container -->
  <section id="info-location" class="info-location-container container"></section>

  <!-- Social container -->
  <section id="social" class="social-container container"></section>

  <footer>
    <div class="footer container">

    </div>
  </footer>
</body>
</html>
